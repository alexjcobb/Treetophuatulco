<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {% if page.nav == 'home' %}
      {{ page.title }}
    {% elsif page.title %}
      {{ page.title }} | TreeTop Villa
    {% else %}
      TreeTop Villa Huatulco
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: 'Oceanfront villa above Tangolunda Bay in Huatulco, Oaxaca.' }}"
  >

  <link
  rel="stylesheet"
  href="{{ '/styles.css' | relative_url }}"
>

<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta name="robots" content="index,follow">

<meta name="theme-color" content="#24352d">

<meta property="og:site_name" content="TreeTop Villa Huatulco">
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | TreeTop Villa{% else %}TreeTop Villa Huatulco{% endif %}">
<meta property="og:description" content="{{ page.description | default: 'Oceanfront villa above Tangolunda Bay in Huatulco, Oaxaca.' }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/hero.jpg' | absolute_url }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | TreeTop Villa{% else %}TreeTop Villa Huatulco{% endif %}">
<meta name="twitter:description" content="{{ page.description | default: 'Oceanfront villa above Tangolunda Bay in Huatulco, Oaxaca.' }}">
<meta name="twitter:image" content="{{ '/assets/hero.jpg' | absolute_url }}">
  
  <link
    rel="icon"
    href="{{ '/assets/favicon.png' | relative_url }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/styles.css' | relative_url }}"
  >
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VacationRental",
  "additionalType": "Villa",
  "name": "TreeTop Villa Huatulco",
  "identifier": "treetop-villa-huatulco-001",
  "description": "{{ page.description | default: 'Oceanfront villa above Tangolunda Bay in Huatulco, Oaxaca.' | escape }}",
  "url": "{{ page.url | absolute_url }}",

  "latitude": 15.770440,
  "longitude": -96.101277,

  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Huatulco",
    "addressRegion": "Oaxaca",
    "addressCountry": "MX"
  },

  "image": [
    "{{ '/assets/hero.jpg' | absolute_url }}",
    "{{ '/assets/living-room.jpg' | absolute_url }}",
    "{{ '/assets/primary-bedroom.jpg' | absolute_url }}",
    "{{ '/assets/bedroom-2.jpg' | absolute_url }}",
    "{{ '/assets/bedroom-3.jpg' | absolute_url }}",
    "{{ '/assets/bathroom-1.jpg' | absolute_url }}",
    "{{ '/assets/bathroom-2.jpg' | absolute_url }}",
    "{{ '/assets/treetop-deck.jpg' | absolute_url }}",
    "{{ '/assets/rooftop-lounge.jpg' | absolute_url }}",
    "{{ '/assets/gym.jpg' | absolute_url }}"
  ],

  "containsPlace": {
    "@type": "Accommodation",
    "additionalType": "EntirePlace",

    "occupancy": {
      "@type": "QuantitativeValue",
      "value": 8
    },

    "numberOfBedrooms": 4,

    "amenityFeature": [
      {
        "@type": "LocationFeatureSpecification",
        "name": "pool",
        "value": true
      },
      {
        "@type": "LocationFeatureSpecification",
        "name": "poolType",
        "value": "Outdoor"
      },
      {
        "@type": "LocationFeatureSpecification",
        "name": "gymFitnessEquipment",
        "value": true
      },
      {
        "@type": "LocationFeatureSpecification",
        "name": "beachAccess",
        "value": true
      },
      {
        "@type": "LocationFeatureSpecification",
        "name": "kitchen",
        "value": true
      },
      {
        "@type": "LocationFeatureSpecification",
        "name": "outdoorGrill",
        "value": true
      },
      {
        "@type": "LocationFeatureSpecification",
        "name": "patio",
        "value": true
      },
      {
        "@type": "LocationFeatureSpecification",
        "name": "tv",
        "value": true
      }
    ]
  }
}
</script>  

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QQ76105WBQ"></script>

        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;

    })(window, document, "clarity", "script", "y0cmof6rg8");
</script>

</head>

<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/script.js' | relative_url }}"></script>

</body>
</html>
