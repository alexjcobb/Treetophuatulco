<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {% if page.nav == 'home' %}
      {{ page.title }}
    {% elsif page.title %}
      {{ page.title }} | TreeTop Villa
    {% else %}
      TreeTop Villa Huatulco
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: 'Oceanfront villa above Tangolunda Bay in Huatulco, Oaxaca.' }}"
  >

  <link
    rel="icon"
    href="{{ '/assets/favicon.png' | relative_url }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/styles.css' | relative_url }}"
  >

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QQ76105WBQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-QQ76105WBQ');
</script>
  

</head>

<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/script.js' | relative_url }}"></script>

</body>
</html>
