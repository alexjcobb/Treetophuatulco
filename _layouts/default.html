<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}">
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | TreeTop Villa
    {% else %}
      TreeTop Villa
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: 'Oceanfront villa above Tangolunda Bay in Huatulco, Oaxaca.' }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/styles.css' | relative_url }}"
  >
</head>

<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}
<script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
