<header class="site-header">
  <div class="container nav">

    <a
      class="brand"
      href="{{ '/' | relative_url }}"
      aria-label="TreeTop Villa home page"
    >
      <img
        src="{{ '/assets/logo-mark.png' | relative_url }}"
        alt="TreeTop Villa logo"
      >

      <div class="brand-text">
        <span class="brand-title">TreeTop Villa</span>
        <span class="brand-sub">Tangolunda Bay, Huatulco</span>
      </div>
    </a>

    <nav class="nav-links" aria-label="Primary Navigation">

      <a
        href="{{ '/' | relative_url }}"
        class="{% if page.nav == 'home' %}active{% endif %}">
        Home
      </a>

      <a
        href="{{ '/stay.html' | relative_url }}"
        class="{% if page.nav == 'stay' %}active{% endif %}">
        Stay
      </a>

      <a
        href="{{ '/gallery.html' | relative_url }}"
        class="{% if page.nav == 'gallery' %}active{% endif %}">
        Gallery
      </a>

      <a
        href="{{ '/area.html' | relative_url }}"
        class="{% if page.nav == 'area' %}active{% endif %}">
        Area
      </a>

      <a
        href="{{ '/reviews.html' | relative_url }}"
        class="{% if page.nav == 'reviews' %}active{% endif %}">
        Reviews
      </a>

      <a
        href="{{ '/faq.html' | relative_url }}"
        class="{% if page.nav == 'faq' %}active{% endif %}">
        FAQ
      </a>

      <a
        href="{{ '/contact.html' | relative_url }}"
        class="{% if page.nav == 'contact' %}active{% endif %}">
        Contact
      </a>

      <a
        class="btn btn-primary"
        href="https://www.explorehuatulco.com/Escapia/Details/2104-279857"
        target="_blank"
        rel="noopener"
      >
        Book Now
      </a>

    </nav>

  </div>
</header>
